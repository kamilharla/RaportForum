<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Foresight</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="header-root"></div>
<div id="tabs-root"></div>

<div class="body">

  <div class="canvas">

    <div class="view" id="view-map">
      <div class="view-inner" id="map-inner"><svg id="map-svg"></svg><div class="tip" id="tip-map"></div></div>
      <div class="sbar"><span class="live">AKTYWNY</span><span>EPO/PATSTAT 2020–2026 · 3 kategorie technologiczne</span><span style="margin-left:auto">SGH WARSZAWA · FORUM KARPACZ 2026</span></div>
    </div>

    <div class="view" id="view-net">
      <div class="view-inner" id="net-inner"><svg id="net-svg"></svg><div class="tip" id="tip-net"></div></div>
      <div class="sbar"><span class="live">AKTYWNY</span><span>Przeciągnij węzły · Scroll=zoom · Klik=szczegóły</span></div>
    </div>

    <div class="view on" id="view-mx">
      <div class="mwrap" id="mx-container"></div>
      <div class="sbar"><span class="live">AKTYWNY</span><span>Specjalizacje technologiczne wg dominujących filarów patentowych z 3 kategorii</span></div>
    </div>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/network.js"></script>
<script src="js/matrix.js"></script>
<script src="js/app.js"></script>

<script>
  async function loadPartial(url, targetId) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      document.getElementById(targetId).innerHTML = await res.text();
    } catch (e) {
      console.warn(`Nie można załadować partiala ${url}:`, e);
    }
  }
  document.addEventListener('DOMContentLoaded', () => {
    loadPartial('partials/header.html', 'header-root');
    loadPartial('partials/tabs.html',  'tabs-root');
  });
</script>

</body>
</html>
