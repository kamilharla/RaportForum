<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#07111f"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#0e2a45" stroke-width="1.2"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#0e2a45" stroke-width="0.8"/>

  <!-- Horizon line -->
  <line x1="7" y1="32" x2="57" y2="32" stroke="#1e3a5a" stroke-width="1"/>

  <!-- North needle (pointing up = foresight direction) — cyan -->
  <polygon points="32,8 29,31 32,27 35,31" fill="#00c8ff"/>
  <!-- South counterweight — muted -->
  <polygon points="32,56 29,33 32,37 35,33" fill="#1a3a55"/>

  <!-- Cardinal ticks -->
  <line x1="32" y1="7"  x2="32" y2="11"  stroke="#00c8ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="32" x2="53" y2="32"  stroke="#2a5070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7"  y1="32" x2="11" y2="32"  stroke="#2a5070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="57" x2="32" y2="53"  stroke="#2a5070" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Diagonal ticks (lighter) -->
  <line x1="49.7" y1="14.3" x2="47.2" y2="16.8" stroke="#142840" stroke-width="1" stroke-linecap="round"/>
  <line x1="14.3" y1="14.3" x2="16.8" y2="16.8" stroke="#142840" stroke-width="1" stroke-linecap="round"/>
  <line x1="49.7" y1="49.7" x2="47.2" y2="47.2" stroke="#142840" stroke-width="1" stroke-linecap="round"/>
  <line x1="14.3" y1="49.7" x2="16.8" y2="47.2" stroke="#142840" stroke-width="1" stroke-linecap="round"/>

  <!-- Center pivot -->
  <circle cx="32" cy="32" r="4" fill="#07111f" stroke="#00c8ff" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="1.5" fill="#00c8ff"/>
</svg>
